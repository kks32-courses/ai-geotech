    - "1a. Exploratory data analysis": 01-dtree/01a-eda-liquefaction.ipynb
    - "1b. Decision tree, random forest, XGBoost": 01-dtree/01b-classification.ipynb
    - Exercises:
      - "1a. Exploratory data analysis": 01-dtree/01a-eda-liquefaction-exercise.ipynb
      - "1b. Classification": 01-dtree/01b-classification-exercise.ipynb
  - "2. Explainable AI":
    - 02-xai/index.md
    - "2a. Explainable Boosting Machine": 02-xai/02a-ebm.ipynb
    - "2a. Explainable Boosting Machine (exercise)": 02-xai/02a-ebm-exercise.ipynb
  - "3. Multi-Layer Perceptron":
