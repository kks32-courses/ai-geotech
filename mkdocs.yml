    - "3b. MLP pile capacity": 03-mlp/03b-mlp-pile-capacity.ipynb
    - "3c. MLP function approximation": 03-mlp/03c-mlp-function-approximation.ipynb
    - "3d. MLP extrapolation": 03-mlp/03d-mlp-extrapolation.ipynb
    - Theory:
      - Universal approximation theorem: 03-mlp/uat.md
      - Activation function ReLU: 03-mlp/relu.md
      - Binary cross entropy: 03-mlp/bce.md
      - Automatic differentiation: 03-mlp/ad.md
      - Gradient descent: 03-mlp/sgd.md
    - Exercises:
