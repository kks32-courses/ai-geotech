site_name: AI in Geotechnical Engineering
site_author: Krishna Kumar
site_description: Course materials for AI in Geotechnical Engineering
site_url: https://github.com/kks32-courses/ai-geotech
repo_url: https://github.com/kks32-courses/ai-geotech
use_directory_urls: false

exclude_docs: |
  .*
  /templates/
  *.pptx
  .env*
  chroma_db/
  *.aux
  *.log
  *.nav
  *.snm
  *.toc
  *.out
  *.vrb
  *.fls
  *.fdb_latexmk
  *.synctex.gz
  *.bak

repo_name: SciML Course Repo

theme:
  name: material
  logo: chishiki.png
  favicon: chishiki.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - announce.dismiss
  
  icon:
    repo: fontawesome/brands/github
  

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: true
      show_input: true
      theme: light
  - git-revision-date-localized:
      type: date
  
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: "🔗"
  
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js
  - javascripts/katex.js
  - javascripts/adaptive-width.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Decision Trees and Random Forests:
    - 01-dtree/index.md
    - Exploratory data analysis: 01-dtree/01a-eda-liquefaction.ipynb
    - Decision tree, random forest, XGBoost: 01-dtree/01b-classification.ipynb
    - Exercises:
      - Exploratory data analysis: 01-dtree/01a-eda-liquefaction-exercise.ipynb
      - Classification: 01-dtree/01b-classification-exercise.ipynb
  - Explainable AI:
    - 02-xai/index.md
    - Explainable Boosting Machine: 02-xai/02a-ebm.ipynb
    - Exercise: 02-xai/02a-ebm-exercise.ipynb
  - Multi-Layer Perceptron:
    - 03-mlp/index.md
    - MLP classification: 03-mlp/03a-mlp-classification.ipynb
    - MLP pile capacity: 03-mlp/03b-mlp-pile-capacity.ipynb
    - MLP function approximation: 03-mlp/03c-mlp-function-approximation.ipynb
    - MLP extrapolation: 03-mlp/03d-mlp-extrapolation.ipynb
    - Theory:
      - Universal approximation theorem: 03-mlp/uat.md
      - Activation function ReLU: 03-mlp/relu.md
      - Binary cross entropy: 03-mlp/bce.md
      - Automatic differentiation: 03-mlp/ad.md
      - Gradient descent: 03-mlp/sgd.md
    - Exercises:
      - MLP classification: 03-mlp/03a-mlp-classification-exercise.ipynb
      - MLP function approximation: 03-mlp/03c-mlp-function-approximation-exercise.ipynb
      - MLP pile capacity: 03-mlp/03b-mlp-pile-capacity-exercise.ipynb
  - Convolutional Neural Networks:
    - 04-cnn/index.md
    - Soil image classification: 04-cnn/04a-cnn-soil-classification.ipynb
    - FWI velocity inversion: 04-cnn/04b-cnn-fwi-velocity.ipynb
    - Exercises:
      - Soil image classification: 04-cnn/04a-cnn-soil-classification-exercise.ipynb
      - FWI velocity inversion: 04-cnn/04b-cnn-fwi-velocity-exercise.ipynb
  - Recurrent Networks and LSTM:
    - 05-lstm/index.md
    - LSTM liquefaction: 05-lstm/05a-lstm-liquefaction.ipynb
    - Exercise: 05-lstm/05a-lstm-liquefaction-exercise.ipynb
  - Clustering:
    - 06-clustering/index.md
    - Fetch CPT data (DesignSafe API): 06-clustering/06a-fetch-cpt-data-dapi.ipynb
    - Clustering analysis: 06-clustering/06b-clustering-analysis.ipynb
    - Exercise: 06-clustering/06b-clustering-analysis-exercise.ipynb
  - Large Language Models:
    - 07-llm/index.md
    - Direct API calls: 07-llm/07a-llm-bearing-capacity-direct.ipynb
    - Multi-agent calculator: 07-llm/07b-llm-bearing-capacity-agents.ipynb
    - RAG over geotechnical reports: 07-llm/07c-llm-rag-geotechnical.ipynb
    - Exercises:
      - Direct API calls: 07-llm/07a-llm-bearing-capacity-direct-exercise.ipynb
      - Multi-agent calculator: 07-llm/07b-llm-bearing-capacity-agents-exercise.ipynb
      - RAG: 07-llm/07c-llm-rag-geotechnical-exercise.ipynb
  - Physics-Informed Neural Networks:
    - 08-pinn/index.md
    - PINN oscillator: 08-pinn/08a-pinn.ipynb
    - 1D wave equation (PINN vs FD): 08-pinn/08b-pinn-forward.ipynb
    - 1D consolidation: 08-pinn/08c-1d-consolidation-pinns.ipynb
    - 1D consolidation (L-BFGS): 08-pinn/08d-1d-consolidation-pinns-lbfgs.ipynb
